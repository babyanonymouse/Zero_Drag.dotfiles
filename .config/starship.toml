"$schema" = 'https://starship.rs/config-schema.json'

palette = "catppuccin_mocha"

# A modern, clean 2-line prompt
# Combines the directory, git info, and all contextual environments (Python, Node, Docker, etc)
format = """
[╭─](bold lavender)$directory$git_branch$git_status$fill$all
[╰─](bold lavender)$character"""

# This fills the space between the left prompt and right prompt natively
[fill]
symbol = " "

[directory]
style = "bold blue"
read_only = " ��"
read_only_style = "bold red"
format = "[  $path ]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "bold mauve"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold red"
format = "[$all_status$ahead_behind]($style) "

# Python environments (virtualenv, conda)
[python]
symbol = " "
style = "bold yellow"
format = '[$symbol$py_version (\($virtualenv\))]($style) '

# Node environments
[nodejs]
symbol = " "
style = "bold green"
format = '[$symbol$version]($style) '

# Rust environments
[rust]
symbol = " "
style = "bold peach"
format = '[$symbol$version]($style) '

# Package version
[package]
symbol = "󰏗 "
style = "bold text"
format = '[$symbol$version]($style) '

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[✗](bold red)"
vimcmd_symbol = "[❮](bold green)"

# --- PALETTE DEFINITION ---
