# Kitty Configuration
# Part of Zero-Drag Dotfiles
# Merged & Optimized from Alacritty, Ghostty, and Kitty options

# --- Font Config ---
font_family      JetBrainsMono Nerd Font
font_size        12.0
# Cell height adjustment (equivalent to Ghostty's adjust-cell-height = 8%)
modify_font      cell_height +8%

# --- Window Layout ---
remember_window_size  no
initial_window_width  100c
initial_window_height 30c
# Padding (vertical 12, horizontal 14, matching Ghostty)
window_padding_width  12 14
hide_window_decorations yes
confirm_os_window_close 0

# --- Performance & Opacity ---
background_opacity 0.85
copy_on_select     yes
hide_mouse_cursor_when_typing yes

# --- Cursor & Scrollback ---
cursor_shape          block
cursor_blink_interval 0
scrollback_lines      10000

# --- Keybindings ---
map ctrl+v            paste_from_clipboard
map ctrl+shift+c      copy_to_clipboard
map ctrl+shift+v      paste_from_clipboard

# --- Dynamic Color Theme Integration ---
# Includes the dynamically fanned-out color schemes from wallcolors.py
include ~/.cache/ricelin/kitty-colors